<!-- billing.component.html (Angular 18 — uses @if and @for control flow) -->
<div class="billing-container">
  @if (invoices.length === 0) {
    <p class="no-invoices">No invoices found.</p>
  }

  @if (invoices.length > 0) {
    <table class="invoices-table">
      <thead>
        <tr>
          <th>Invoice ID</th>
          <th>Amount</th>
          <th>Due Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (invoice of invoices; track invoice.id) {
          <tr>
            <td>{{ invoice.id }}</td>
            <td>{{ invoice.amount | currency }}</td>
            <td>{{ invoice.dueDate | date }}</td>
            <td>{{ invoice.status }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
