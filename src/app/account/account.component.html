<!-- account.component.html (Angular 18 — uses @if control flow) -->
<div class="account-container">
  <h2>Account Settings</h2>
  <form [formGroup]="accountForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      @if (accountForm.get('email')?.invalid && accountForm.get('email')?.touched) {
        <span class="error-message">Please enter a valid email address.</span>
      }
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" formControlName="phone" />
      @if (accountForm.get('phone')?.invalid && accountForm.get('phone')?.touched) {
        <span class="error-message">Phone number is required.</span>
      }
    </div>

    <button type="submit" [disabled]="accountForm.invalid">Save Changes</button>
  </form>
</div>
