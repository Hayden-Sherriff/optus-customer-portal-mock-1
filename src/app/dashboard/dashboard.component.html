<!-- dashboard.component.html (Angular 14 — uses *ngIf and *ngFor) -->
<div class="dashboard-container">
  <div *ngIf="isLoading" class="loading-spinner">
    Loading your plans...
  </div>


  <div *ngIf="hasError" class="error-banner">
    Unable to load your plans. Please try again.
  </div>


  <div *ngIf="!isLoading && !hasError" class="plans-grid">
    <div *ngFor="let plan of (plans$ | async); trackBy: trackByPlan"
         class="plan-card">
      <h3>{{ plan.name }}</h3>
      <p>Data: {{ plan.data }}</p>
      <p>Calls: {{ plan.calls }}</p>
      <p>Expires: {{ plan.expiry }}</p>
    </div>
  </div>
</div>
